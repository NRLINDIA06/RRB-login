<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>उपयोगकर्ता लॉग इन / USER LOGIN</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; background: #5b7fc4; display: flex; align-items: center; justify-content: center; font-family: Arial, sans-serif; padding: 20px; }
    .card { background: #fff; border-radius: 12px; padding: 32px 28px 36px; width: 100%; max-width: 420px; box-shadow: 0 4px 24px rgba(0,0,0,0.18); }
    .card-title { font-size: 1.55rem; font-weight: 900; color: #111; margin-bottom: 26px; line-height: 1.3; }
    .field-label { font-size: 0.95rem; color: #111; margin-bottom: 8px; }
    .required { color: #e53935; margin-left: 3px; }
    .input-text { width: 100%; padding: 14px 16px; background: #fdf8d0; border: 1.5px solid #e2d96e; border-radius: 8px; font-size: 1rem; color: #888; outline: none; margin-bottom: 18px; }
    .input-text:focus { border-color: #b0a000; color: #222; }
    .dob-row { display: flex; gap: 10px; margin-bottom: 6px; }
    .dob-select { flex: 1; padding: 13px 10px; background: #fdf8d0; border: 1.5px solid #e2d96e; border-radius: 8px; font-size: 1rem; color: #888; outline: none; cursor: pointer; }
    .dob-select:focus { border-color: #b0a000; }
    .dob-example { font-size: 0.85rem; color: #555; margin-bottom: 18px; margin-top: 4px; }
    .captcha-box { width: 100%; height: 62px; border-radius: 8px; background: linear-gradient(90deg, #d4f04e 0%, #7ee8a2 50%, #38d2d2 100%); display: flex; align-items: center; justify-content: center; margin-bottom: 12px; position: relative; overflow: hidden; }
    .captcha-box::before { content: ''; position: absolute; top: 50%; left: 8%; right: 8%; height: 1.5px; background: rgba(60,60,60,0.35); transform: translateY(-50%); }
    .captcha-text { font-size: 2rem; font-weight: 900; letter-spacing: 10px; color: #1a1a1a; font-family: 'Courier New', monospace; position: relative; z-index: 1; text-decoration: line-through; text-decoration-color: rgba(60,60,60,0.35); text-decoration-thickness: 2px; }
    .captcha-input { width: 100%; padding: 14px 16px; background: #fff; border: 1.5px solid #ccc; border-radius: 8px; font-size: 1rem; color: #888; outline: none; margin-bottom: 8px; }
    .captcha-input:focus { border-color: #5b7fc4; color: #222; }
    .help-circle { display: flex; justify-content: center; margin-bottom: 24px; }
    .help-circle span { width: 28px; height: 28px; border: 2px solid #aaa; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #aaa; font-size: 0.9rem; cursor: pointer; }
    .btn { width: 100%; padding: 17px; border: none; border-radius: 8px; font-size: 1.05rem; font-weight: 700; cursor: pointer; margin-bottom: 12px; }
    .btn-login { background: #4a7bc8; color: #fff; }
    .btn-login:hover { background: #3a6ab7; }
    .btn-forgot { background: #5b7fc4; color: #fff; }
    .btn-forgot:hover { background: #4a6eb3; }
    .error-msg { color: #e53935; font-size: 0.85rem; margin-top: -8px; margin-bottom: 10px; display: none; }
    .toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); background: #323232; color: #fff; padding: 12px 24px; border-radius: 8px; font-size: 0.95rem; z-index: 9999; display: none; box-shadow: 0 4px 14px rgba(0,0,0,0.25); }
    #pdfOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 10000; display: none; flex-direction: column; }
    #pdfOverlay.active { display: flex; }
    #pdfBar { background: #4a7bc8; display: flex; align-items: center; justify-content: space-between; padding: 12px 18px; flex-shrink: 0; }
    #pdfBar span { color: #fff; font-weight: 700; font-size: 1rem; }
    #pdfBar .bar-btns { display: flex; gap: 10px; }
    .bar-btn { padding: 8px 16px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 0.9rem; border: none; }
    .bar-btn-dl { background: #fff; color: #4a7bc8; }
    .bar-btn-close { background: rgba(255,255,255,0.15); color: #fff; }
    #pdfFrame { flex: 1; width: 100%; border: none; background: #fff; }
  </style>
</head>
<body>
<div class="toast" id="toast"></div>

<div id="pdfOverlay">
  <div id="pdfBar">
    <span>RRB CBT-II — E-Call Letter / ई-कॉल लेटर</span>
    <div class="bar-btns">
      <button class="bar-btn bar-btn-dl" onclick="downloadPDF()">⬇ Download</button>
      <button class="bar-btn bar-btn-close" onclick="closePDF()">✕ Close</button>
    </div>
  </div>
  <iframe id="pdfFrame" src=""></iframe>
</div>

<div class="card">
  <div class="card-title">उपयोगकर्ता लॉग इन /<br>USER LOGIN</div>

  <div class="field-label">पंजीकरण संख्या / Registration Number <span class="required">*</span></div>
  <input type="text" id="regNum" class="input-text" placeholder="Enter Registration Number." />
  <div class="error-msg" id="errReg">Please enter your registration number.</div>

  <div class="field-label">उपयोगकर्ता पासवर्ड / User Password (Date of Birth) <span class="required">*</span></div>
  <div class="dob-row">
    <select class="dob-select" id="dobDD"><option value="">DD</option></select>
    <select class="dob-select" id="dobMM"><option value="">MM</option></select>
    <select class="dob-select" id="dobYY"><option value="">YYYY</option></select>
  </div>
  <div class="dob-example">(Eg. 26 / 01 / 1990)</div>
  <div class="error-msg" id="errDob">Please select your date of birth.</div>

  <div class="captcha-box">
    <div class="captcha-text" id="captchaDisplay"></div>
  </div>
  <input type="text" id="captchaInput" class="captcha-input" placeholder="Type numbers as shown in image" maxlength="6" />
  <div class="error-msg" id="errCaptcha">Incorrect captcha. Please try again.</div>

  <div class="help-circle"><span>?</span></div>

  <button class="btn btn-login" onclick="handleLogin()">लॉग इन करें / LOG IN</button>
  <button class="btn btn-forgot" onclick="showToast('Password reset link would be sent to your registered email.')">Forgot Password</button>
</div>

<script>
  // Dropdowns
  const ddEl = document.getElementById('dobDD');
  const mmEl = document.getElementById('dobMM');
  const yyEl = document.getElementById('dobYY');
  for(let d=1;d<=31;d++){let o=document.createElement('option');o.value=d<10?'0'+d:String(d);o.text=o.value;ddEl.appendChild(o);}
  for(let m=1;m<=12;m++){let o=document.createElement('option');o.value=m<10?'0'+m:String(m);o.text=o.value;mmEl.appendChild(o);}
  for(let y=new Date().getFullYear();y>=1920;y--){let o=document.createElement('option');o.value=String(y);o.text=o.value;yyEl.appendChild(o);}

  // Captcha
  let captchaCode = Math.floor(100000 + Math.random() * 900000).toString();
  document.getElementById('captchaDisplay').textContent = captchaCode;

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 3000);

    document.getElementById(id).style.display = show ? 'block' : 'none';

  let pdfObjectURL = null;

  function getPDFUrl() {
    if (!pdfObjectURL) {
      const binary = atob(PDF_B64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      const blob = new Blob([bytes], { type: 'application/pdf' });
      pdfObjectURL = URL.createObjectURL(blob);
    }
    return pdfObjectURL;
  }

  function openPDF() {
    document.getElementById('pdfFrame').src = getPDFUrl();
    document.getElementById('pdfOverlay').classList.add('active');
  }

  function closePDF() {
    document.getElementById('pdfOverlay').classList.remove('active');
    document.getElementById('pdfFrame').src = '';
  }

  function downloadPDF() {
    const a = document.createElement('a');
    a.href = getPDFUrl();
    a.download = 'RRB_CBT2_AdmitCard.pdf';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }

  function handleLogin() {
    const reg = document.getElementById('regNum').value.trim();
    const d = document.getElementById('dobDD').value;
    const m = document.getElementById('dobMM').value;
    const y = document.getElementById('dobYY').value;
    const cap = document.getElementById('captchaInput').value.trim();
    let valid = true;
    if (!reg) { showError('errReg', true); valid = false; } else showError('errReg', false);
    if (!d || !m || !y) { showError('errDob', true); valid = false; } else showError('errDob', false);
    if (cap !== captchaCode) { showError('errCaptcha', true); valid = false; } else showError('errCaptcha', false);
    if (!valid) return;
    openPDF();
  }
